{% extends "base.html" %}
{% block title %}Novo produto | DiagPlan{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Cadastrar produto</h1>
<div class="card shadow-sm"><div class="card-body">
<form method="post">
  <div class="mb-3"><label class="form-label">Nome do produto *</label><input class="form-control" name="name" required maxlength="120"></div>
  <div class="mb-3"><label class="form-label">Categoria</label><input class="form-control" name="category" maxlength="80"></div>
  <div class="mb-3"><label class="form-label">Código SKU (opcional)</label><input class="form-control" name="sku" maxlength="40"></div>
  <button class="btn btn-primary">Salvar produto</button> <a class="btn btn-outline-secondary" href="/produtos">Cancelar</a>
</form></div></div>
{% endblock %}
